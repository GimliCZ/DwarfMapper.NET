# SPDX-License-Identifier: GPL-2.0-only
# Static analysis of THIS repository's GitHub Actions workflows (round 31 T20, research A5).
#
# SHA pinning — already enforced everywhere — stopped the tj-actions class (CVE-2025-30066), but not the classes that
# live in a workflow's own text: template injection from untrusted event fields, pull_request_target misuse, over-broad
# permissions, credential persistence in checkout. zizmor finds those statically. Its SARIF lands in the repository's
# code-scanning view next to CodeQL's.
#
# BLOCKING since round 34. It was authored in reporting mode, to become blocking once the owner had triaged the first
# run's findings (the baseline). Every run read for the flip, six on master and PR #11 on 2026-10-27, reported none, so
# there was nothing to triage. An open finding now fails the job: fix it, or suppress it in the workflow's text with
# `# zizmor: ignore[<rule>]` and the reason beside it, where review sees it. The tool not producing a report fails it
# too: "no SARIF" must never read as "no findings". The gate is Assert-ZizmorReportClean in scripts/gate-checks.ps1.
#
# Actions are pinned to full commit SHAs; the trailing `# vN` is the human-readable version. Bump BOTH together.
name: actions-security
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zizmor:
    runs-on: ubuntu-24.04   # not ubuntu-latest: see the note at the top of ci.yml
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
    timeout-minutes: 10
    steps:
      # Round 31 T20: first step of every job. AUDIT mode records each job's network egress and changes no
      # behaviour; the recorded baseline is what a later round tightens to an allow-list (block mode).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Pinned by version, like every tool whose output feeds a gate here. zizmor exits non-zero WHEN IT HAS
      # FINDINGS; `|| true` keeps the report it wrote, and the next step is what fails the job on them.
      - name: Run zizmor
        run: pipx run zizmor==1.30.1 --format sarif . > zizmor.sarif || true
      - name: Fail on a missing report or any open finding
        shell: pwsh
        run: |
          . ./scripts/gate-checks.ps1
          Assert-ZizmorReportClean -Path zizmor.sarif
      # Uploaded even when the step above failed, so the findings that failed it are in code scanning.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('zizmor.sarif') != ''
        with:
          sarif_file: zizmor.sarif
          category: zizmor
