# Actions are pinned to full commit SHAs (CRA/SLSA supply-chain hardening); the trailing `# vN` is the
# human-readable version. When bumping a version, update BOTH the SHA and the comment.
name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
  # Both added for the NIGHTLY TIER — the `mutation` matrix (all three Stryker legs) and the `deep-test` job
  # (deep suite + coverage floors + ILVerify) — which is far too slow to gate a push; see each job's own
  # comment. Those are the ONLY jobs guarded to these two events; every other job keeps running exactly when
  # it did before. The side effect is that the nightly cron also re-runs the push/PR jobs, which is harmless
  # (they are the same jobs on the same commit) and gives a daily green/red signal on master.
  #
  # The nightly tier's cost, from the local measurements each job's timeout is derived from (12-core machine):
  # mutation runtime 11:36 + generator 19:41 + doctooling ~5:30 ≈ 37 min aggregate, deep suite ~1:45 with
  # coverage ~+0:30, ILVerify ~1 s, benchmark smoke + allocation pins ~6:40 (round-21 T8) — plus per-job
  # restore/build/tool-install overhead. The jobs run in PARALLEL on separate runners, so nightly
  # wall-clock ≈ the slowest leg (the generator's), not the sum.
  # There is deliberately NO total-duration gate: the maintainer's 2026-08-21 ruling raised the old 44-minute
  # deep-tier ceiling so that ALL legs run EVERY night with no rotation — record the measured total, do not
  # arbitrate it (Issues/round22/RESEARCH-97-PERCENT-GATES.md, "Maintainer rulings").
  #
  # NOTE: GitHub runs `schedule` ONLY on the repository's DEFAULT BRANCH. The nightly tier therefore
  # stays dormant until this lands on master — on a feature branch it can only be started by hand via
  # workflow_dispatch. That is not a misconfiguration, but it does mean "it is in CI" and "it has actually
  # run" are different claims until the merge happens.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'

      # ── SDK pin drift check (ISSUE-038) ─────────────────────────────────────
      # global.json pins an exact SDK with rollForward: disable, but that only constrains what the SDK
      # RESOLVES to — nothing stopped this workflow from installing a different one and nothing said so
      # out loud. Previously CI asked for '10.0.x' (newest patch of the day) while global.json said
      # '10.0.101' with rollForward: latestPatch, so contributor and CI could silently compile on
      # different compilers. This step is the assertion that makes the pin mean something: if the two
      # ever disagree, the build says which two.
      - name: Verify the installed SDK matches global.json
        run: |
          set -euo pipefail
          # sed, not `grep -oP`: PCRE is a GNU-grep build option and fails outright under some locales.
          pinned=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json)
          actual=$(dotnet --version)
          echo "global.json pins: $pinned"
          echo "dotnet resolves:  $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::SDK drift — global.json pins $pinned but the runner resolved $actual." \
                 "Update global.json AND the dotnet-version in every setup-dotnet step together."
            exit 1
          fi

      # --locked-mode (round-22 S1): restore must resolve EXACTLY the committed packages.lock.json graphs
      # or fail NU1004 — the repeatable-restore proof. The flag here is self-documentation; the load-bearing
      # wiring is Directory.Build.props' RestoreLockedMode on '$(CI)' == 'true', which GitHub sets for every
      # job, so the IMPLICIT restores (surface-matrix's test, the Stryker legs' builds, codeql's build,
      # CycloneDX, the AOT publishes) run locked too without per-job flags. The AOT `-r` publishes work
      # because every project in that P2P closure declares <RuntimeIdentifiers> so its lock file carries
      # both RID graphs. NuGetAudit (level low, mode all) runs inside these restores and NU1901–NU1904 are
      # errors under TreatWarningsAsErrors; the one advisory alive today (NU1903, AutoMapper 14.0.0) is
      # suppressed per-project with the reason in each csproj — bumping is license-blocked (v15+ is RPL-1.5).
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      # Category!=SurfaceMatrix keeps the executed surface cross-product (854 cells, its own job below) out
      # of the default leg. It is excluded for isolation, not for speed — it is the one leg whose red is
      # expected to be a list of findings rather than a regression, so mixing it into the ordinary run would
      # make every build look broken.
      # --blame-hang is the H7-f runner-level backstop (Issues/ledgers/H7-timeout-dissection.md §4): a hung
      # testhost is dumped and killed with the offending test NAMED, instead of the job idling until its
      # timeout eats the evidence. Applied to every plain `dotnet test` step in this workflow; the Stryker
      # legs deliberately do NOT carry it — there the per-mutant ceiling plays that role and a second killer
      # would fight it.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m --collect:"XPlat Code Coverage" --results-directory TestResults

      # ── Coverage gate for DwarfMapper.Generator ─────────────────────────────
      # Thresholds: line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
      # Target-file requirements (EquatableArray / TypeInterfaces / BlittableProof /
      # LocationInfo / FlattenGraphDirective each ≥ 90% line) are enforced here as well.
      # IMPORTANT: pushing ci.yml changes requires the `workflow` OAuth scope.
      - name: Check generator coverage thresholds
        # Thresholds: overall line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
        # Per-file: EquatableArray/TypeInterfaces/BlittableProof/LocationInfo/FlattenGraphDirective ≥ 90% line.
        # IMPORTANT: pushing ci.yml requires the `workflow` OAuth scope.
        run: |
          set -euo pipefail
          # A solution-wide `dotnet test --collect` emits ONE cobertura per test
          # project (Generator.Tests, IntegrationTests, Testing.Tests, CorpusTests —
          # every test project in the solution). Only one of them contains the
          # <package name="DwarfMapper.Generator"> node — so we scan ALL reports and
          # key the gate off that package directly, rather than the file-level root
          # rate (which is diluted by, or missing, the generator).
          mapfile -t COBERTURA < <(find TestResults -name "coverage.cobertura.xml")
          if [ ${#COBERTURA[@]} -eq 0 ]; then echo "No coverage.cobertura.xml found"; exit 1; fi
          python3 - "${COBERTURA[@]}" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          GENERATOR_PACKAGE   = "DwarfMapper.Generator"
          LINE_THRESHOLD      = 0.80
          BRANCH_THRESHOLD    = 0.70
          FILE_LINE_THRESHOLD = 0.90

          target_files = {
              "EquatableArray.cs", "TypeInterfaces.cs", "BlittableProof.cs",
              "LocationInfo.cs", "FlattenGraphDirective.cs",
          }

          # Locate the generator package across every report. If split across multiple
          # reports, keep the best line-rate per file and the best package-level rates.
          gen_line = gen_branch = -1.0
          file_rates = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for pkg in root.iter("package"):
                  if pkg.attrib.get("name") != GENERATOR_PACKAGE:
                      continue
                  gen_line   = max(gen_line,   float(pkg.attrib.get("line-rate",   "0")))
                  gen_branch = max(gen_branch, float(pkg.attrib.get("branch-rate", "0")))
                  for cls in pkg.iter("class"):
                      filename = cls.attrib.get("filename", "").replace("\\", "/").split("/")[-1]
                      if filename in target_files:
                          rate = float(cls.attrib.get("line-rate", "0"))
                          file_rates[filename] = max(file_rates.get(filename, 0.0), rate)

          failures = []
          if gen_line < 0:
              failures.append(f"No '{GENERATOR_PACKAGE}' package found in any coverage report")
          else:
              if gen_line < LINE_THRESHOLD:
                  failures.append(f"Generator line coverage {gen_line*100:.1f}% < {LINE_THRESHOLD*100:.0f}%")
              if gen_branch < BRANCH_THRESHOLD:
                  failures.append(f"Generator branch coverage {gen_branch*100:.1f}% < {BRANCH_THRESHOLD*100:.0f}%")
              for fname in target_files:
                  rate = file_rates.get(fname, 0.0)
                  if rate < FILE_LINE_THRESHOLD:
                      failures.append(f"{fname} line coverage {rate*100:.1f}% < {FILE_LINE_THRESHOLD*100:.0f}%")

          if failures:
              print("COVERAGE GATE FAILED:")
              for msg in failures:
                  print(f"  - {msg}")
              sys.exit(1)

          print(f"Coverage gate PASSED  generator line={gen_line*100:.1f}% branch={gen_branch*100:.1f}%")
          for fname, rate in sorted(file_rates.items()):
              print(f"  {fname}: {rate*100:.1f}%")
          PYEOF

  # ── The executed surface cross-product ────────────────────────────────────
  # Every [DwarfSurface] element, at every legal declaration site, in every case its declaration admits, at
  # every endpoint — 854 cells, each verified in BOTH directions against the element's own AppliesTo claim.
  # Its own leg because its red means something different from every other leg's: a failing cell is a
  # measured statement that a caller wrote something the generator accepted, changed nothing for, and said
  # nothing about. The default leg excludes it with Category!=SurfaceMatrix.
  #
  # BLOCKING. It was non-blocking while the first full run was red by design; the matrix is now GREEN, and
  # the 174 red cells it started with are down to 17 — 4 covered by a recorded finding in
  # DeclaredDivergences.Reasons (2 findings, each re-measured every run and each failing the build the moment
  # it starts working) and 13 where a single option of an option bag has no surface at that endpoint. Both
  # remaining findings are maintainer-acknowledged design decisions, not silent defects. A leg that cannot
  # fail is decoration, and the value of this one is entirely in the failure: a red cell here means a caller
  # wrote something the generator accepted, changed nothing for, and said nothing about. Runtime ~25s: the
  # baseline compile is memoized per (endpoint, fixture, options), so the cross-product costs one compile per
  # cell rather than two.
  surface-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # --blame-hang: the H7-f backstop, same rationale as in build-test.
      - run: dotnet test tests/DwarfMapper.Generator.Tests/DwarfMapper.Generator.Tests.csproj -c Release --filter "Category=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m

  # ── Mutation testing: ALL THREE legs, nightly ─────────────────────────────────────────────────────────
  # One matrix, three configs: the SHIPPED RUNTIME assembly (stryker-config.runtime.json), the GENERATOR
  # (stryker-config.json) and the DOCUMENTATION PIPELINE (stryker-config.doctooling.json). The runtime leg
  # ran here first (it previously ran in NO job at all — a config someone had to remember to invoke via
  # `housekeeping.ps1 -Mutation`, and a score nobody measures is free to regress silently in either
  # direction); round-21 T5 brought the two sibling legs in beside it under the maintainer's 2026-08-21
  # ruling that ALL legs run EVERY night, no rotation (Issues/round22/RESEARCH-97-PERCENT-GATES.md).
  #
  # SCHEDULED, NOT PER-PUSH, AND DELIBERATELY NOT FILTERED. Each leg runs the WHOLE test suite against every
  # mutant, which costs tens of minutes — too slow to gate a push, so it runs nightly plus on demand.
  # Do NOT "fix" a slow leg by narrowing the test set. Stryker does support a `test-case-filter`, and
  # scoping the runtime leg to the 23 classes that then killed something did cut it to ~3 minutes — that was
  # measured. It was REJECTED on purpose: a filter is a hand-maintained LIST, and lists drift. The first
  # time someone adds a test that becomes the sole killer of a mutant, the filter silently drops that kill,
  # the SCORE GOES UP, and coverage goes down with nothing in the repo noticing. A coverage tool is the
  # worst possible place to install that failure mode. The real defect behind the old slowness was
  # load-induced timeouts being credited as detections, and that is fixed per-config by
  # `additional-timeout`, not by running fewer tests. See Issues/ledgers/E3-E1-report.md.
  mutation:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # One leg failing its break threshold must NOT cancel the others mid-run: the whole point of the
      # nightly is three scored reports every night, and a cancelled leg leaves no report at all.
      fail-fast: false
      matrix:
        include:
          # timeout-minutes per leg, sized from the local measurement rather than guessed (~10x measured,
          # same rule the runtime leg used from the start): Stryker's default concurrency is cores/2, so a
          # ~4-core hosted runner drops from 6 parallel mutant sessions on the measuring machine to ~2 and
          # each pass is slower too. These jobs should fail on a real score regression — never because the
          # box was slower than the day the number was recorded.
          - leg: runtime      # measured 11:36 (2026-08-21, 12 cores)
            config: stryker-config.runtime.json
            timeout: 120
          - leg: generator    # measured 19:41 (2026-08-21, 12 cores; 85 static mutants re-run the suite)
            config: stryker-config.json
            timeout: 200
          - leg: doctooling   # measured 5:04-5:30 (2026-08-21, 12 cores)
            config: stryker-config.doctooling.json
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # A mis-ordered config silently disables the leg (H4): Stryker 4.16 refuses to run when
      # thresholds.break > thresholds.low ("Threshold low must be more than or equal to threshold break")
      # AND EXITS 0 — exactly how the doctooling leg sat unrunnable-and-green from 2026-08-19 until H1
      # noticed. Checked BEFORE the tool install so the mistake fails in seconds, with its cause named.
      # Mirrors Assert-StrykerConfigSane in scripts/housekeeping.ps1; the two must stay in step.
      - name: Assert the config is runnable (break <= low)
        run: |
          set -euo pipefail
          python3 - '${{ matrix.config }}' <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          t = json.load(open(path))["stryker-config"]["thresholds"]
          if t["break"] > t["low"]:
              print(f"::error::{path}: thresholds.break ({t['break']}) > thresholds.low ({t['low']}) - "
                    "Stryker 4.16 refuses to run this config AND exits 0, so the leg would be silently "
                    "dead. Whenever break moves, move low with it.")
              sys.exit(1)
          print(f"{path}: break {t['break']} <= low {t['low']} - runnable")
          PYEOF
      # Pinned, like CycloneDX in the sbom job, and for the same reason the SDK is pinned in build-test: the
      # score is only comparable across runs if the thing computing it does not move. Stryker's test
      # DISCOVERY and its TIMEOUT arithmetic both feed the score directly, and both are version behaviour —
      # an unpinned upgrade could move the number with no repo change to point at.
      # The tool targets net8.0, but its runtimeconfig sets rollForwardOnNoCandidateFx=2 (Major), so it runs
      # on the pinned 10.0.101 runtime with no .NET 8 installed. Verified locally on a machine carrying only
      # runtimes 7/9/10.
      - run: dotnet tool install --global dotnet-stryker --version 4.16.0
      # Exits non-zero when the score falls below the config's thresholds.break — each leg keeps its own
      # measured floor (see each config's comment for the measurement it came from, and for why an older,
      # higher number must not be "restored": the runtime leg's 66 counted load-induced timeouts on mutants
      # that cannot hang as detections). If a leg reports Timeouts on mutants that cannot hang, the runner
      # is slower than the timeout cushion assumes: raise `additional-timeout` in that config. Do NOT add a
      # test filter to make it fit.
      - run: dotnet stryker --config-file ${{ matrix.config }}
      # The exit code is necessary but NOT sufficient: Stryker exits 0 when its `mutate` globs match nothing.
      # Every mutant comes back "Removed by mutate filter", no score is calculated, and a leg that tested
      # NOTHING passes. That is not hypothetical — it is what stryker-config.runtime.json did on 2026-08-16,
      # because the globs must be PROJECT-relative ('**/Name.cs'), not repo-root-relative. This mirrors
      # Assert-MutantsWereTested in scripts/housekeeping.ps1; the two must stay in step.
      - name: Assert the run was not vacuous
        run: |
          set -euo pipefail
          report=$(find StrykerOutput -name mutation-report.json -print | sort | tail -n 1)
          if [ -z "$report" ]; then
            echo "::error::${{ matrix.leg }} mutation: no mutation-report.json was written — the leg produced no report at all"
            exit 1
          fi
          # Counted over the raw text rather than parsed: the report embeds every mutated file's full source,
          # so it runs to megabytes and parsing buys nothing this check needs.
          scoreable=$(grep -o '"status"[[:space:]]*:[[:space:]]*"\(Killed\|Survived\|Timeout\|NoCoverage\)"' "$report" | wc -l)
          echo "${{ matrix.leg }}: $scoreable scoreable mutants"
          if [ "$scoreable" -eq 0 ]; then
            echo "::error::${{ matrix.leg }} mutation: 0 scoreable mutants — the run was VACUOUS and Stryker still exited 0." \
                 "Check that the config's 'mutate' globs are PROJECT-relative ('**/Name.cs')."
            exit 1
          fi
      # The doctooling leg once wrote a mutated renderer's output over 2,523 lines of tracked documentation
      # (H1, 2026-08-19): Stryker has no test sandbox, so a mutated writer writes to the REAL tree.
      # RepoWriteGuard's contract since then is that a mutation run leaves the tracked tree byte-clean —
      # this step makes that contract a checked CI invariant for every leg instead of a ledger sentence.
      - name: Assert the tracked tree survived the leg
        run: git diff --exit-code
      # ...and the UNTRACKED half of the same contract (I4). bin/ is git-ignored, so the step above is
      # blind to the mutated DwarfMapper.Generator.dll copies Stryker plants in analyzer-referencing test
      # bins — it backs up only files it OVERWRITES, and those bins hold no pre-run copy (analyzer-only
      # reference, no CopyLocal), so no *.stryker-unchanged marker is written and restore never touches
      # them. The next incremental build keeps the mutant. Runs the SAME function housekeeping's three
      # legs call, dot-sourced rather than re-implemented, so the two cannot drift.
      - name: Assert no mutated product binary survived the leg
        shell: pwsh
        run: |
          . ./scripts/gate-checks.ps1
          Assert-NoMutatedProductBinaries -Leg '${{ matrix.leg }}' -Root (Get-Location).Path
      # Kept on failure too: when the score drops, the report names which mutants changed status, which is the
      # only thing that distinguishes a real regression from a re-classification.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.leg }}
          path: StrykerOutput/**/reports/mutation-report.*

  # ── The nightly DEEP TIER: DWARF_DEEP suite + coverage floors + ILVerify ──────────────────────────────
  # The other half of the nightly (round-21 T5): the deep test tier (every registered fuzz/property/torture
  # population multiplied per tests/Shared/DeepTier.cs — 15,786 tests vs the fast tier's ~7,700), coverage
  # collected in the SAME run and gated against the measured per-assembly floors, and ILVerify over the
  # shipped runtime + a generated-consumer assembly. The fast per-push jobs are untouched by this tier.
  #
  # The job body is ONE housekeeping invocation on purpose: `-Nightly` pins exactly this recipe
  # (-Deep -Coverage -ILVerify, exhaustion/AOT skipped), so a maintainer reproduces the nightly locally
  # with one switch and the CI job and the local gate cannot drift apart — the same reason the mutation
  # guard is mirrored rather than reinvented. Unlike build-test, this runs the sln WITHOUT the
  # SurfaceMatrix exclusion, exactly as housekeeping always has locally: the matrix is green and blocking
  # now, and the deep tier wants the whole population. The floors inside are MEASURED fast-tier values;
  # deep coverage is a superset, so the gate can only be tighter than its measurement, never looser.
  deep-test:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Sized from measurement + margin, NOT an aspirational cap: locally (12 cores) the deep suite is ~105 s,
    # coverage collection adds ~18 s, ReportGenerator ~15 s, ILVerify ~1 s, and the T8 benchmark smoke +
    # allocation exact-pin gate ~6:40 (measured twice, 6:36/6:44); restore+build ~3 min and the tool
    # installs ~1 min put the whole job near 14 min. A ~4-core hosted runner is ~3x slower on the
    # test/build parts but the smoke is mostly single-threaded measurement (~1.5-2x) — ~28 min total,
    # plus ~50% margin -> 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # Pinned for the same reason as Stryker and CycloneDX: both tools' output feeds a gate (the floors
      # read ReportGenerator's Summary.json; ILVerify's verdict IS the stage), so the thing computing the
      # number must not move under the gate. Versions are the locally-verified ones.
      - run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
      - run: dotnet tool install --global dotnet-ilverify --version 10.0.11
      # --locked-mode: same S1 repeatable-restore proof as build-test; see the comment there.
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      # Housekeeping's suite stage builds incrementally; building here first keeps a compile failure
      # distinguishable from a test failure in the job log, same as build-test.
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      - run: pwsh scripts/housekeeping.ps1 -Nightly
      # Kept on failure too, same idiom as the mutation reports: a floor failure names its numbers.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-coverage-report
          path: TestResults/coverage-report/
      # The smoke's full JSON report — the allocation gate's evidence. Same keep-on-failure reason: a
      # pin failure names its numbers, and the report carries the competitor context around them.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-smoke-results
          path: BenchmarkDotNet.Artifacts/results/

  aot-trim-gate:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
          - rid: win-x64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # Fails the build on any IL2xxx (trim) or IL3xxx (AOT) warning.
      #
      # PublishAot is deliberately NOT passed on the command line. The sample's csproj already sets
      # <PublishAot>true</PublishAot>, and `-p:` sets a GLOBAL property, which MSBuild flows down the entire
      # project graph — including src/DwarfMapper.Generator and src/DwarfMapper.CodeFixes, which target
      # netstandard2.0 and can never be AOT-compiled. That produced NETSDK1207 and the job died before
      # compiling anything: a gate failing to START, not a gate catching a regression. It was red from
      # 2026-07-25 until 2026-07-26 for exactly this reason, while the README went on advertising
      # "AOT / trim-safe (CI-verified)". A project-level property applies to that project alone.
      - run: dotnet publish samples/DwarfMapper.AotSample/DwarfMapper.AotSample.csproj -c Release -r ${{ matrix.rid }} -warnaserror -o aot-out
      # Now that the flag is gone, nothing on the command line asserts AOT-ness — and a framework-dependent
      # publish still produces a runnable binary that would sail through the behavioural gate below, leaving
      # it green while proving nothing. NativeAOT emits a native image with NO managed assembly and NO
      # runtimeconfig.json, so assert their ABSENCE before trusting the run.
      - name: Assert the publish really was NativeAOT
        shell: bash
        run: |
          set -euo pipefail
          if ls aot-out/*.runtimeconfig.json >/dev/null 2>&1 \
            || ls aot-out/DwarfMapper.AotSample.dll >/dev/null 2>&1; then
            echo "FAIL: aot-out holds a managed assembly or runtimeconfig.json, so this was NOT a NativeAOT" >&2
            echo "      publish. The behavioural gate below would then pass without proving anything." >&2
            ls -la aot-out >&2
            exit 1
          fi
          echo "NativeAOT confirmed: no managed assembly, no runtimeconfig.json in aot-out."
      # Publishing proves it COMPILES trim/AOT-clean; it says nothing about behaviour. The sample is written
      # as a behavioural gate (36 `return 1` sites) and was never executed, so CORRECTNESS.md's "runs a
      # behavioural gate over the published native binary" was untrue until this step existed.
      - name: Execute the published AOT binary (behavioural gate)
        shell: bash
        run: |
          set -euo pipefail
          BIN="aot-out/DwarfMapper.AotSample"
          [[ "${{ matrix.rid }}" == win-* ]] && BIN="aot-out/DwarfMapper.AotSample.exe"
          if [[ ! -x "$BIN" && ! -f "$BIN" ]]; then
            echo "FAIL: published AOT binary not found at $BIN — a gate that cannot find its subject must not pass." >&2
            exit 1
          fi
          "./$BIN"

  # ── Conformance gate (fail-closed) ────────────────────────────────────────
  # samples/DwarfMapper.Conformance returns a real exit code from its assertions and was never executed by
  # CI, so it only ran when someone remembered. The script also fails on ABSENCE — missing artifact, wrong
  # commit, or a shrunken assertion count — because a gate that only fails when the run fails still passes
  # when the run never happened, and "skipped" is indistinguishable from "passed" in a green check.
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: chmod +x scripts/conformance-gate.sh
      - run: ./scripts/conformance-gate.sh linux-x64
      - name: Publish the dated conformance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-results
          path: conformance/results/

  # ── Forward-compatibility leg: does the generator still load in a NEWER compiler? ────────────────────
  # The floor (Microsoft.CodeAnalysis 5.0.0) is what every other job builds, and it is what the pinned SDK
  # 10.0.101 carries. This job answers the other half: a consumer on a newer 10.0.x SDK runs our generator
  # inside THEIR compiler, and a generator built against a newer Roslyn than the host refuses to load with
  # CS9057. Measured locally: referencing 5.6.0 while building on SDK 10.0.101 fails with exactly that,
  # which is why this leg needs its own, newer SDK and cannot live in build-test.
  #
  # NON-BLOCKING ON PURPOSE, FOR NOW. It was authored without a machine that has a newer 10.0.x SDK, so its
  # first real run happens here. Flip `continue-on-error` to false once it has been seen green — a gate that
  # cannot fail is decoration, and leaving it like this permanently would be exactly the kind of thing the
  # rest of this pipeline exists to prevent.
  roslyn-forward-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'   # deliberately NOT the pin: this leg is about a newer host
      - name: Drop the SDK pin for this job only
        run: |
          set -euo pipefail
          rm -f global.json     # the working copy only; the committed pin is untouched
          dotnet --version
      # Locked-mode note (round-22 S1): this leg inherits RestoreLockedMode from CI=true like every job.
      # It deliberately runs an UNPINNED newer SDK, and a newer SDK's package-prune data can in principle
      # change the resolved graph — if this leg ever reds with NU1004 while build-test stays green, that IS
      # the diagnosis (SDK-driven graph drift, not a lock-file defect), and it is information this
      # forward-compat leg exists to surface, not noise to exempt.
      - name: Build the generator against the floor, on a newer compiler
        run: dotnet build DwarfMapper.NET.sln -c Release
      # Same exclusion as build-test: this leg asks "does the generator still LOAD in a newer compiler", and
      # the matrix has its own dedicated job above. (Until 2026-08-18 the stated reason was that the matrix's
      # expected red would drown the answer; it is green now, so the reason is duplication, not noise.)
      # --blame-hang: the H7-f backstop, same rationale as in build-test.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: csharp
      - run: dotnet build DwarfMapper.NET.sln -c Release
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  sbom:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: dotnet tool install --global CycloneDX --version 6.2.0
      - run: dotnet CycloneDX DwarfMapper.NET.sln -o ./sbom
      # SLSA build-provenance attestation for the generated SBOM artifact.
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ./sbom
