# Actions are pinned to full commit SHAs (CRA/SLSA supply-chain hardening); the trailing `# vN` is the
# human-readable version. When bumping a version, update BOTH the SHA and the comment.
name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  # Both added for the NIGHTLY TIER — the `mutation` matrix (all five Stryker legs) and the `deep-test` job
  # (deep suite + coverage floors + ILVerify) — which is far too slow to gate a push; see each job's own
  # comment. Those are the ONLY jobs guarded to these two events; every other job keeps running exactly when
  # it did before. The side effect is that the nightly cron also re-runs the push/PR jobs, which is harmless
  # (they are the same jobs on the same commit) and gives a daily green/red signal on master.
  #
  # The nightly tier's cost, from the local measurements each job's timeout is derived from (12-core machine):
  # mutation runtime 11:36 + generator 19:41 + doctooling ~5:30 ≈ 37 min aggregate, deep suite ~1:45 with
  # coverage ~+0:30, ILVerify ~1 s, benchmark smoke + allocation pins ~6:40 (round-21 T8) — plus per-job
  # restore/build/tool-install overhead. The jobs run in PARALLEL on separate runners, so nightly
  # wall-clock ≈ the slowest leg (the generator's), not the sum.
  # There is deliberately NO total-duration gate: the maintainer's 2026-08-21 ruling raised the old 44-minute
  # deep-tier ceiling so that ALL legs run EVERY night with no rotation — record the measured total, do not
  # arbitrate it (Issues/round22/RESEARCH-97-PERCENT-GATES.md, "Maintainer rulings").
  #
  # NOTE: GitHub runs `schedule` ONLY on the repository's DEFAULT BRANCH. The nightly tier therefore
  # stays dormant until this lands on master — on a feature branch it can only be started by hand via
  # workflow_dispatch. That is not a misconfiguration, but it does mean "it is in CI" and "it has actually
  # run" are different claims until the merge happens.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'

      # ── SDK pin drift check (ISSUE-038) ─────────────────────────────────────
      # global.json pins an exact SDK with rollForward: disable, but that only constrains what the SDK
      # RESOLVES to — nothing stopped this workflow from installing a different one and nothing said so
      # out loud. Previously CI asked for '10.0.x' (newest patch of the day) while global.json said
      # '10.0.101' with rollForward: latestPatch, so contributor and CI could silently compile on
      # different compilers. This step is the assertion that makes the pin mean something: if the two
      # ever disagree, the build says which two.
      - name: Verify the installed SDK matches global.json
        run: |
          set -euo pipefail
          # sed, not `grep -oP`: PCRE is a GNU-grep build option and fails outright under some locales.
          pinned=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json)
          actual=$(dotnet --version)
          echo "global.json pins: $pinned"
          echo "dotnet resolves:  $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::SDK drift — global.json pins $pinned but the runner resolved $actual." \
                 "Update global.json AND the dotnet-version in every setup-dotnet step together."
            exit 1
          fi

      # --locked-mode (round-22 S1): restore must resolve EXACTLY the committed packages.lock.json graphs
      # or fail NU1004 — the repeatable-restore proof. The flag here is self-documentation; the load-bearing
      # wiring is Directory.Build.props' RestoreLockedMode on '$(CI)' == 'true', which GitHub sets for every
      # job, so the IMPLICIT restores (surface-matrix's test, the Stryker legs' builds, codeql's build,
      # CycloneDX, the AOT publishes) run locked too without per-job flags. The AOT `-r` publishes work
      # because every project in that P2P closure declares <RuntimeIdentifiers> so its lock file carries
      # both RID graphs. NuGetAudit (level low, mode all) runs inside these restores and NU1901–NU1904 are
      # errors under TreatWarningsAsErrors; the one advisory alive today (NU1903, AutoMapper 14.0.0) is
      # suppressed per-project with the reason in each csproj — bumping is license-blocked (v15+ is RPL-1.5).
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      # Category!=SurfaceMatrix keeps the executed surface cross-product (854 cells, its own job below) out
      # of the default leg. It is excluded for isolation, not for speed — it is the one leg whose red is
      # expected to be a list of findings rather than a regression, so mixing it into the ordinary run would
      # make every build look broken.
      # --blame-hang is the H7-f runner-level backstop (Issues/ledgers/H7-timeout-dissection.md §4): a hung
      # testhost is dumped and killed with the offending test NAMED, instead of the job idling until its
      # timeout eats the evidence. Applied to every plain `dotnet test` step in this workflow; the Stryker
      # legs deliberately do NOT carry it — there the per-mutant ceiling plays that role and a second killer
      # would fight it.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m --collect:"XPlat Code Coverage" --results-directory TestResults

      # ── Coverage gate for DwarfMapper.Generator ─────────────────────────────
      # Thresholds: line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
      # Target-file requirements (EquatableArray / TypeInterfaces / BlittableProof /
      # LocationInfo / FlattenGraphDirective each ≥ 90% line) are enforced here as well.
      # IMPORTANT: pushing ci.yml changes requires the `workflow` OAuth scope.
      - name: Check generator coverage thresholds
        # Thresholds: overall line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
        # Per-file: EquatableArray/TypeInterfaces/BlittableProof/LocationInfo/FlattenGraphDirective ≥ 90% line.
        # IMPORTANT: pushing ci.yml requires the `workflow` OAuth scope.
        run: |
          set -euo pipefail
          # A solution-wide `dotnet test --collect` emits ONE cobertura per test
          # project (Generator.Tests, IntegrationTests, Testing.Tests, CorpusTests —
          # every test project in the solution). Only one of them contains the
          # <package name="DwarfMapper.Generator"> node — so we scan ALL reports and
          # key the gate off that package directly, rather than the file-level root
          # rate (which is diluted by, or missing, the generator).
          mapfile -t COBERTURA < <(find TestResults -name "coverage.cobertura.xml")
          if [ ${#COBERTURA[@]} -eq 0 ]; then echo "No coverage.cobertura.xml found"; exit 1; fi
          python3 - "${COBERTURA[@]}" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          GENERATOR_PACKAGE   = "DwarfMapper.Generator"
          LINE_THRESHOLD      = 0.80
          BRANCH_THRESHOLD    = 0.70
          FILE_LINE_THRESHOLD = 0.90

          target_files = {
              "EquatableArray.cs", "TypeInterfaces.cs", "BlittableProof.cs",
              "LocationInfo.cs", "FlattenGraphDirective.cs",
          }

          # Locate the generator package across every report. If split across multiple
          # reports, keep the best line-rate per file and the best package-level rates.
          gen_line = gen_branch = -1.0
          file_rates = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for pkg in root.iter("package"):
                  if pkg.attrib.get("name") != GENERATOR_PACKAGE:
                      continue
                  gen_line   = max(gen_line,   float(pkg.attrib.get("line-rate",   "0")))
                  gen_branch = max(gen_branch, float(pkg.attrib.get("branch-rate", "0")))
                  for cls in pkg.iter("class"):
                      filename = cls.attrib.get("filename", "").replace("\\", "/").split("/")[-1]
                      if filename in target_files:
                          rate = float(cls.attrib.get("line-rate", "0"))
                          file_rates[filename] = max(file_rates.get(filename, 0.0), rate)

          failures = []
          if gen_line < 0:
              failures.append(f"No '{GENERATOR_PACKAGE}' package found in any coverage report")
          else:
              if gen_line < LINE_THRESHOLD:
                  failures.append(f"Generator line coverage {gen_line*100:.1f}% < {LINE_THRESHOLD*100:.0f}%")
              if gen_branch < BRANCH_THRESHOLD:
                  failures.append(f"Generator branch coverage {gen_branch*100:.1f}% < {BRANCH_THRESHOLD*100:.0f}%")
              for fname in target_files:
                  rate = file_rates.get(fname, 0.0)
                  if rate < FILE_LINE_THRESHOLD:
                      failures.append(f"{fname} line coverage {rate*100:.1f}% < {FILE_LINE_THRESHOLD*100:.0f}%")

          if failures:
              print("COVERAGE GATE FAILED:")
              for msg in failures:
                  print(f"  - {msg}")
              sys.exit(1)

          print(f"Coverage gate PASSED  generator line={gen_line*100:.1f}% branch={gen_branch*100:.1f}%")
          for fname, rate in sorted(file_rates.items()):
              print(f"  {fname}: {rate*100:.1f}%")
          PYEOF

  # ── The executed surface cross-product ────────────────────────────────────
  # Every [DwarfSurface] element, at every legal declaration site, in every case its declaration admits, at
  # every endpoint — 854 cells, each verified in BOTH directions against the element's own AppliesTo claim.
  # Its own leg because its red means something different from every other leg's: a failing cell is a
  # measured statement that a caller wrote something the generator accepted, changed nothing for, and said
  # nothing about. The default leg excludes it with Category!=SurfaceMatrix.
  #
  # BLOCKING. It was non-blocking while the first full run was red by design; the matrix is now GREEN, and
  # the 174 red cells it started with are down to 17 — 4 covered by a recorded finding in
  # DeclaredDivergences.Reasons (2 findings, each re-measured every run and each failing the build the moment
  # it starts working) and 13 where a single option of an option bag has no surface at that endpoint. Both
  # remaining findings are maintainer-acknowledged design decisions, not silent defects. A leg that cannot
  # fail is decoration, and the value of this one is entirely in the failure: a red cell here means a caller
  # wrote something the generator accepted, changed nothing for, and said nothing about. Runtime ~25s: the
  # baseline compile is memoized per (endpoint, fixture, options), so the cross-product costs one compile per
  # cell rather than two.
  surface-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # --blame-hang: the H7-f backstop, same rationale as in build-test.
      - run: dotnet test tests/DwarfMapper.Generator.Tests/DwarfMapper.Generator.Tests.csproj -c Release --filter "Category=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m

  # ── Mutation testing: ALL THREE legs, nightly ─────────────────────────────────────────────────────────
  # One matrix, five configs: the SHIPPED RUNTIME assembly (stryker-config.runtime.json), the GENERATOR
  # (stryker-config.json), the DOCUMENTATION PIPELINE (stryker-config.doctooling.json), the CODE FIXES
  # (stryker-config.codefixes.json) and the ROUND-27 EXTRACTED PIPELINE (stryker-config.pipeline.json). The runtime leg
  # ran here first (it previously ran in NO job at all — a config someone had to remember to invoke via
  # `housekeeping.ps1 -Mutation`, and a score nobody measures is free to regress silently in either
  # direction); round-21 T5 brought the two sibling legs in beside it under the maintainer's 2026-08-21
  # ruling that ALL legs run EVERY night, no rotation (Issues/round22/RESEARCH-97-PERCENT-GATES.md).
  #
  # SCHEDULED, NOT PER-PUSH, AND DELIBERATELY NOT FILTERED. Each leg runs the WHOLE test suite against every
  # mutant, which costs tens of minutes — too slow to gate a push, so it runs nightly plus on demand.
  # Do NOT "fix" a slow leg by narrowing the test set. Stryker does support a `test-case-filter`, and
  # scoping the runtime leg to the 23 classes that then killed something did cut it to ~3 minutes — that was
  # measured. It was REJECTED on purpose: a filter is a hand-maintained LIST, and lists drift. The first
  # time someone adds a test that becomes the sole killer of a mutant, the filter silently drops that kill,
  # the SCORE GOES UP, and coverage goes down with nothing in the repo noticing. A coverage tool is the
  # worst possible place to install that failure mode. The real defect behind the old slowness was
  # load-induced timeouts being credited as detections, and that is fixed per-config by
  # `additional-timeout`, not by running fewer tests. See Issues/ledgers/E3-E1-report.md.
  mutation:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # One leg failing its break threshold must NOT cancel the others mid-run: the whole point of the
      # nightly is five scored reports every night, and a cancelled leg leaves no report at all.
      fail-fast: false
      matrix:
        include:
          # timeout-minutes per leg, sized from the local measurement rather than guessed (~10x measured,
          # same rule the runtime leg used from the start): Stryker's default concurrency is cores/2, so a
          # ~4-core hosted runner drops from 6 parallel mutant sessions on the measuring machine to ~2 and
          # each pass is slower too. These jobs should fail on a real score regression — never because the
          # box was slower than the day the number was recorded.
          - leg: runtime      # measured 11:36 (2026-08-21, 12 cores)
            config: stryker-config.runtime.json
            timeout: 120
          - leg: generator    # measured 19:41 (2026-08-21, 12 cores; 85 static mutants re-run the suite)
            config: stryker-config.json
            timeout: 200
          - leg: doctooling   # measured 5:04-5:30 (2026-08-21, 12 cores)
            config: stryker-config.doctooling.json
            timeout: 60
          - leg: codefixes    # measured 6:20 (2026-08-26, 12 cores, after the round-27 kill program)
            config: stryker-config.codefixes.json
            timeout: 80
          # Round-27 member-resolution phases. SCOPED TO ONE AREA on purpose: a leg over all 13 extracted
          # Pipeline/ files needed to test 1,353 mutants and had not finished after 158 minutes on 12
          # cores, which is past this job's ceiling however generously it is budgeted — GitHub caps a job
          # at six hours and the rule here is ~10x measured. The remaining ten files are covered one area
          # per leg, each sized to complete (Issues/round27/AUDIT-mutation-scope.md).
          # TIMEOUT DEPARTS FROM THE ~10x RULE, deliberately. Measured 2026-08-27 on 12 cores: 37 min for
          # 236 tested mutants (of 13,129 created; 9,583 filtered out-of-leg, 3,240 compile errors). 10x is
          # 370, which BREACHES the 360-minute ceiling GitHub puts on a job — so 350 is the most this rule
          # can ask for, and a leg that needs more than this is by definition too big. That is the size
          # ceiling the one-area-per-leg policy implies; the four sibling legs sit at 5-20 min and fit the
          # rule with room to spare.
          - leg: pipeline     # measured 37:00 (2026-08-27, 12 cores, 236 tested mutants)
            config: stryker-config.pipeline.json
            timeout: 350
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # A mis-ordered config silently disables the leg (H4): Stryker 4.16 refuses to run when
      # thresholds.break > thresholds.low ("Threshold low must be more than or equal to threshold break")
      # AND EXITS 0 — exactly how the doctooling leg sat unrunnable-and-green from 2026-08-19 until H1
      # noticed. Checked BEFORE the tool install so the mistake fails in seconds, with its cause named.
      # Mirrors Assert-StrykerConfigSane in scripts/housekeeping.ps1; the two must stay in step.
      - name: Assert the config is runnable (break <= low)
        run: |
          set -euo pipefail
          python3 - '${{ matrix.config }}' <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          t = json.load(open(path))["stryker-config"]["thresholds"]
          if t["break"] > t["low"]:
              print(f"::error::{path}: thresholds.break ({t['break']}) > thresholds.low ({t['low']}) - "
                    "Stryker 4.16 refuses to run this config AND exits 0, so the leg would be silently "
                    "dead. Whenever break moves, move low with it.")
              sys.exit(1)
          print(f"{path}: break {t['break']} <= low {t['low']} - runnable")
          PYEOF
      # Pinned, like CycloneDX in the sbom job, and for the same reason the SDK is pinned in build-test: the
      # score is only comparable across runs if the thing computing it does not move. Stryker's test
      # DISCOVERY and its TIMEOUT arithmetic both feed the score directly, and both are version behaviour —
      # an unpinned upgrade could move the number with no repo change to point at.
      # The tool targets net8.0, but its runtimeconfig sets rollForwardOnNoCandidateFx=2 (Major), so it runs
      # on the pinned 10.0.101 runtime with no .NET 8 installed. Verified locally on a machine carrying only
      # runtimes 7/9/10.
      - run: dotnet tool install --global dotnet-stryker --version 4.16.0
      # Exits non-zero when the score falls below the config's thresholds.break — each leg keeps its own
      # measured floor (see each config's comment for the measurement it came from, and for why an older,
      # higher number must not be "restored": the runtime leg's 66 counted load-induced timeouts on mutants
      # that cannot hang as detections). If a leg reports Timeouts on mutants that cannot hang, the runner
      # is slower than the timeout cushion assumes: raise `additional-timeout` in that config. Do NOT add a
      # test filter to make it fit.
      - run: dotnet stryker --config-file ${{ matrix.config }}
      # The exit code is necessary but NOT sufficient: Stryker exits 0 when its `mutate` globs match nothing.
      # Every mutant comes back "Removed by mutate filter", no score is calculated, and a leg that tested
      # NOTHING passes. That is not hypothetical — it is what stryker-config.runtime.json did on 2026-08-16,
      # because the globs must be PROJECT-relative ('**/Name.cs'), not repo-root-relative. This mirrors
      # Assert-MutantsWereTested in scripts/housekeeping.ps1; the two must stay in step.
      - name: Assert the run was not vacuous
        run: |
          set -euo pipefail
          report=$(find StrykerOutput -name mutation-report.json -print | sort | tail -n 1)
          if [ -z "$report" ]; then
            echo "::error::${{ matrix.leg }} mutation: no mutation-report.json was written — the leg produced no report at all"
            exit 1
          fi
          # Counted over the raw text rather than parsed: the report embeds every mutated file's full source,
          # so it runs to megabytes and parsing buys nothing this check needs.
          scoreable=$(grep -o '"status"[[:space:]]*:[[:space:]]*"\(Killed\|Survived\|Timeout\|NoCoverage\)"' "$report" | wc -l)
          echo "${{ matrix.leg }}: $scoreable scoreable mutants"
          if [ "$scoreable" -eq 0 ]; then
            echo "::error::${{ matrix.leg }} mutation: 0 scoreable mutants — the run was VACUOUS and Stryker still exited 0." \
                 "Check that the config's 'mutate' globs are PROJECT-relative ('**/Name.cs')."
            exit 1
          fi
      # The doctooling leg once wrote a mutated renderer's output over 2,523 lines of tracked documentation
      # (H1, 2026-08-19): Stryker has no test sandbox, so a mutated writer writes to the REAL tree.
      # RepoWriteGuard's contract since then is that a mutation run leaves the tracked tree byte-clean —
      # this step makes that contract a checked CI invariant for every leg instead of a ledger sentence.
      - name: Assert the tracked tree survived the leg
        run: git diff --exit-code
      # ...and the UNTRACKED half of the same contract (I4). bin/ is git-ignored, so the step above is
      # blind to the mutated DwarfMapper.Generator.dll copies Stryker plants in analyzer-referencing test
      # bins — it backs up only files it OVERWRITES, and those bins hold no pre-run copy (analyzer-only
      # reference, no CopyLocal), so no *.stryker-unchanged marker is written and restore never touches
      # them. The next incremental build keeps the mutant. Runs the SAME function housekeeping's three
      # legs call, dot-sourced rather than re-implemented, so the two cannot drift.
      - name: Assert no mutated product binary survived the leg
        shell: pwsh
        run: |
          . ./scripts/gate-checks.ps1
          Assert-NoMutatedProductBinaries -Leg '${{ matrix.leg }}' -Root (Get-Location).Path
      # Kept on failure too: when the score drops, the report names which mutants changed status, which is the
      # only thing that distinguishes a real regression from a re-classification.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.leg }}
          path: StrykerOutput/**/reports/mutation-report.*

  # ── The nightly DEEP TIER: DWARF_DEEP suite + coverage floors + ILVerify ──────────────────────────────
  # The other half of the nightly (round-21 T5): the deep test tier (every registered fuzz/property/torture
  # population multiplied per tests/Shared/DeepTier.cs — 15,786 tests vs the fast tier's ~7,700), coverage
  # collected in the SAME run and gated against the measured per-assembly floors, and ILVerify over the
  # shipped runtime + a generated-consumer assembly. The fast per-push jobs are untouched by this tier.
  #
  # The job body is ONE housekeeping invocation on purpose: `-Nightly` pins exactly this recipe
  # (-Deep -Coverage -ILVerify, exhaustion/AOT skipped), so a maintainer reproduces the nightly locally
  # with one switch and the CI job and the local gate cannot drift apart — the same reason the mutation
  # guard is mirrored rather than reinvented. Unlike build-test, this runs the sln WITHOUT the
  # SurfaceMatrix exclusion, exactly as housekeeping always has locally: the matrix is green and blocking
  # now, and the deep tier wants the whole population. The floors inside are MEASURED fast-tier values;
  # deep coverage is a superset, so the gate can only be tighter than its measurement, never looser.
  deep-test:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Sized from measurement + margin, NOT an aspirational cap: locally (12 cores) the deep suite is ~105 s,
    # coverage collection adds ~18 s, ReportGenerator ~15 s, ILVerify ~1 s, and the T8 benchmark smoke +
    # allocation exact-pin gate ~6:40 (measured twice, 6:36/6:44); restore+build ~3 min and the tool
    # installs ~1 min put the whole job near 14 min. A ~4-core hosted runner is ~3x slower on the
    # test/build parts but the smoke is mostly single-threaded measurement (~1.5-2x) — ~28 min total,
    # plus ~50% margin -> 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # Pinned for the same reason as Stryker and CycloneDX: both tools' output feeds a gate (the floors
      # read ReportGenerator's Summary.json; ILVerify's verdict IS the stage), so the thing computing the
      # number must not move under the gate. Versions are the locally-verified ones.
      - run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
      - run: dotnet tool install --global dotnet-ilverify --version 10.0.11
      # --locked-mode: same S1 repeatable-restore proof as build-test; see the comment there.
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      # Housekeeping's suite stage builds incrementally; building here first keeps a compile failure
      # distinguishable from a test failure in the job log, same as build-test.
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      - run: pwsh scripts/housekeeping.ps1 -Nightly
      # Kept on failure too, same idiom as the mutation reports: a floor failure names its numbers.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-coverage-report
          path: TestResults/coverage-report/
      # The smoke's full JSON report — the allocation gate's evidence. Same keep-on-failure reason: a
      # pin failure names its numbers, and the report carries the competitor context around them.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-smoke-results
          path: BenchmarkDotNet.Artifacts/results/

  aot-trim-gate:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
          - rid: win-x64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # Fails the build on any IL2xxx (trim) or IL3xxx (AOT) warning.
      #
      # PublishAot is deliberately NOT passed on the command line. The sample's csproj already sets
      # <PublishAot>true</PublishAot>, and `-p:` sets a GLOBAL property, which MSBuild flows down the entire
      # project graph — including src/DwarfMapper.Generator and src/DwarfMapper.CodeFixes, which target
      # netstandard2.0 and can never be AOT-compiled. That produced NETSDK1207 and the job died before
      # compiling anything: a gate failing to START, not a gate catching a regression. It was red from
      # 2026-07-25 until 2026-07-26 for exactly this reason, while the README went on advertising
      # "AOT / trim-safe (CI-verified)". A project-level property applies to that project alone.
      - run: dotnet publish samples/DwarfMapper.AotSample/DwarfMapper.AotSample.csproj -c Release -r ${{ matrix.rid }} -warnaserror -o aot-out
      # Now that the flag is gone, nothing on the command line asserts AOT-ness — and a framework-dependent
      # publish still produces a runnable binary that would sail through the behavioural gate below, leaving
      # it green while proving nothing. NativeAOT emits a native image with NO managed assembly and NO
      # runtimeconfig.json, so assert their ABSENCE before trusting the run.
      - name: Assert the publish really was NativeAOT
        shell: bash
        run: |
          set -euo pipefail
          if ls aot-out/*.runtimeconfig.json >/dev/null 2>&1 \
            || ls aot-out/DwarfMapper.AotSample.dll >/dev/null 2>&1; then
            echo "FAIL: aot-out holds a managed assembly or runtimeconfig.json, so this was NOT a NativeAOT" >&2
            echo "      publish. The behavioural gate below would then pass without proving anything." >&2
            ls -la aot-out >&2
            exit 1
          fi
          echo "NativeAOT confirmed: no managed assembly, no runtimeconfig.json in aot-out."
      # Publishing proves it COMPILES trim/AOT-clean; it says nothing about behaviour. The sample is written
      # as a behavioural gate (36 `return 1` sites) and was never executed, so CORRECTNESS.md's "runs a
      # behavioural gate over the published native binary" was untrue until this step existed.
      - name: Execute the published AOT binary (behavioural gate)
        shell: bash
        run: |
          set -euo pipefail
          BIN="aot-out/DwarfMapper.AotSample"
          [[ "${{ matrix.rid }}" == win-* ]] && BIN="aot-out/DwarfMapper.AotSample.exe"
          if [[ ! -x "$BIN" && ! -f "$BIN" ]]; then
            echo "FAIL: published AOT binary not found at $BIN — a gate that cannot find its subject must not pass." >&2
            exit 1
          fi
          "./$BIN"

  # ── Conformance gate (fail-closed) ────────────────────────────────────────
  # samples/DwarfMapper.Conformance returns a real exit code from its assertions and was never executed by
  # CI, so it only ran when someone remembered. The script also fails on ABSENCE — missing artifact, wrong
  # commit, or a shrunken assertion count — because a gate that only fails when the run fails still passes
  # when the run never happened, and "skipped" is indistinguishable from "passed" in a green check.
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: chmod +x scripts/conformance-gate.sh
      - run: ./scripts/conformance-gate.sh linux-x64
      - name: Publish the dated conformance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-results
          path: conformance/results/

  # ── Forward-compatibility leg: does the generator still load in a NEWER compiler? ────────────────────
  # The floor (Microsoft.CodeAnalysis 5.0.0) is what every other job builds, and it is what the pinned SDK
  # 10.0.101 carries. This job answers the other half: a consumer on a newer 10.0.x SDK runs our generator
  # inside THEIR compiler, and a generator built against a newer Roslyn than the host refuses to load with
  # CS9057. Measured locally: referencing 5.6.0 while building on SDK 10.0.101 fails with exactly that,
  # which is why this leg needs its own, newer SDK and cannot live in build-test.
  #
  # NON-BLOCKING ON PURPOSE, FOR NOW. It was authored without a machine that has a newer 10.0.x SDK, so its
  # first real run happens here. Flip `continue-on-error` to false once it has been seen green — a gate that
  # cannot fail is decoration, and leaving it like this permanently would be exactly the kind of thing the
  # rest of this pipeline exists to prevent.
  roslyn-forward-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'   # deliberately NOT the pin: this leg is about a newer host
      - name: Drop the SDK pin for this job only
        run: |
          set -euo pipefail
          rm -f global.json     # the working copy only; the committed pin is untouched
          dotnet --version
      # Locked-mode note (round-22 S1, RESOLVED 2026-08-23): this leg used to inherit RestoreLockedMode from
      # CI=true like every job, and the note here predicted that a newer SDK could change the resolved graph
      # and red this leg with NU1004 while build-test stayed green — "the diagnosis, not noise to exempt".
      #
      # That prediction came true: the SDK's IMPLICIT AOT/trim packages track the runtime patch, so an
      # unpinned newer host resolved Microsoft.DotNet.ILCompiler and Microsoft.NET.ILLink.Tasks at 10.0.11
      # where the lock file records 10.0.1. The diagnosis stands and is recorded in
      # Issues/round26/FINDING-forward-compat-lockmode.md.
      #
      # What the note did not anticipate is the CONSEQUENCE: restore fails, so the leg never reaches the
      # question it exists to ask — does the generator still LOAD and RUN under a newer compiler. A leg that
      # dies before its own test is worth nothing, and it had been dying since the SDK moved.
      #
      # So locked mode is disabled FOR THIS LEG ONLY. That is not exempting the finding — locked mode stays
      # on for every other job, which is where lock-file integrity is actually gated. It is admitting that a
      # deliberately-unpinned SDK and a pinned lock file cannot both hold, and choosing the one this leg is
      # named after.
      - name: Build the generator against the floor, on a newer compiler
        run: dotnet build DwarfMapper.NET.sln -c Release -p:RestoreLockedMode=false
      # Same exclusion as build-test: this leg asks "does the generator still LOAD in a newer compiler", and
      # the matrix has its own dedicated job above. (Until 2026-08-18 the stated reason was that the matrix's
      # expected red would drown the answer; it is green now, so the reason is duplication, not noise.)
      # --blame-hang: the H7-f backstop, same rationale as in build-test.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: csharp
      - run: dotnet build DwarfMapper.NET.sln -c Release
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  sbom:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: dotnet tool install --global CycloneDX --version 6.2.0
      - run: dotnet CycloneDX DwarfMapper.NET.sln -o ./sbom
      # SLSA build-provenance attestation for the generated SBOM artifact.
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ./sbom

  # ── Reproducible-build verification (round-23 S4) ─────────────────────────────────────────────────────
  # Packs the SHIPPED packages twice from the same commit, wiping every build output in between, and
  # compares them ENTRY BY ENTRY. The repo already claims a CRA-defensive supply chain — CycloneDX SBOM,
  # SLSA build-provenance attestation, SHA256SUMS on every release — and an attestation over bytes nobody
  # can regenerate is a claim without a check. This leg is that check.
  #
  # WHAT IT ACTUALLY FOUND, measured 2026-08-22 on Windows at 81c4ace before this job existed (the same
  # two-pack protocol this job runs): the whole-file SHA-256 of every .nupkg/.snupkg DIFFERS on every
  # pack, and every build-produced entry inside them is BYTE-IDENTICAL. The difference is entirely
  # NuGet.Packaging's OPC envelope — the `<32 hex>.psmdcp` core-properties part is named after a fresh
  # GUID each pack, and `_rels/.rels` names it back. DwarfMapper's own bytes reproduce; NuGet's envelope
  # does not. scripts/repro-pack-check.py's header carries the full measurement and normalises exactly
  # those two parts BY NAME, comparing their content — it is not a tolerance and it does not skip them.
  #
  # Deterministic-build inputs are already set repo-wide and were NOT added for this leg: Directory.Build
  # .props sets Deterministic, ContinuousIntegrationBuild on '$(CI)' == 'true' (GitHub sets CI for every
  # job, which also flips DeterministicSourcePaths and RestoreLockedMode), and EmbedUntrackedSources;
  # Directory.Build.targets turns on the SDK's built-in SourceLink with snupkg symbols. The two packs run
  # in the same directory, so PathMap/DeterministicSourcePaths differences cannot mask a real one either
  # way — this leg asks "same inputs, same bytes?", not "same bytes from two different paths?", which is
  # a strictly harder question nobody has asked yet and which is NOT claimed here.
  #
  # -p:EnablePackageValidation=false, with the reason: ApiCompat package validation is a SEPARATE existing
  # gate that runs AfterTargets="Pack", it downloads the 1.0.2-rc.1 baseline from nuget.org (an external
  # input a reproducibility leg should not depend on), and its red would mean "the API changed", not "the
  # bytes moved" — the two must not be able to masquerade as each other. Those two reasons stand on their
  # own and are why the flag stays. What is NO LONGER a reason: validation was also BROKEN when this job
  # was written (I15 — `dotnet pack` exited 1 on an intentional suppression wired through a property the
  # SDK never reads). I15 is fixed as of round 23 and `dotnet pack` is green on both packages, so this
  # flag now hides nothing. Running validation somewhere nightly — rather than only at a version tag in
  # release.yml — remains open; see I15's DONE row for why it was not folded into this job.
  reproducible-build:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ESTIMATE, not a measurement — this job has never run on a hosted runner (see the note at the top of
    # this file about the nightly tier being dormant until master carries it). Local Windows 12-core at
    # 81c4ace: one round of `git clean -xdf` + locked restore + pack of both packages = 22.0 s and 20.0 s
    # (measured twice), so ~45 s for both rounds with a warm NuGet cache. A ~4-core hosted runner with a
    # COLD package cache is the dominant cost: reckon ~2 min restore + ~2 min build/pack per round, ~9 min
    # with SDK setup. Doubled -> 25. Replace this paragraph with the first real run's wall-clock.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # ONE step for both rounds on purpose: if the two rounds' command lines could drift apart, the
      # comparison would be measuring two different builds and calling the difference non-determinism.
      # The output directories live under RUNNER_TEMP because `git clean -xdf` is what separates the
      # rounds, and it would otherwise delete round A's packages along with the build outputs.
      - name: Pack twice from the same commit, wiping every build output in between
        run: |
          set -euo pipefail
          pack_round() {
            local out="$1"
            rm -rf "$out"
            dotnet restore DwarfMapper.NET.sln --locked-mode
            for proj in src/DwarfMapper/DwarfMapper.csproj src/DwarfMapper.Testing/DwarfMapper.Testing.csproj; do
              dotnet pack "$proj" -c Release -o "$out" -p:EnablePackageValidation=false
            done
          }
          pack_round "$RUNNER_TEMP/pack-a"
          # -x removes ignored files (bin/, obj/, the lot); -d recurses into untracked directories. The
          # tree must be exactly as checked out before round B, or round B is an incremental build and
          # the comparison proves nothing about a clean one.
          git clean -xdf
          git status --porcelain
          pack_round "$RUNNER_TEMP/pack-b"
      - name: Compare the two packs entry by entry
        run: python3 scripts/repro-pack-check.py "$RUNNER_TEMP/pack-a" "$RUNNER_TEMP/pack-b"
      # Kept on failure only, same idiom as the mutation reports and the coverage report: a red here is a
      # claim about specific bytes, and the reader needs the bytes.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-pack-packages
          path: |
            ${{ runner.temp }}/pack-a
            ${{ runner.temp }}/pack-b

  # ── Package-size ceiling (round-23 S6) ────────────────────────────────────────────────────────────────
  # `dotnet pack` the two SHIPPED packages and fail if either is over its measured KB ceiling. The check
  # itself, its measurement provenance and its failure message live in scripts/gate-checks.ps1
  # (Assert-PackageSizeWithinCeiling) — dot-sourced here rather than re-implemented, the same reason the
  # mutation matrix dot-sources Assert-NoMutatedProductBinaries: a CI copy of a gate is a gate that can
  # drift from the one a maintainer runs locally.
  #
  # Ceiling = the measurement truncated to whole KB, raise-only-with-re-measure (invariant R1). It is a
  # SECONDARY signal on purpose: ApiCompat package validation and PublicAPI.Shipped/Unshipped already
  # guard the public surface, and size catches the class they structurally cannot — an embedded resource
  # nobody meant to ship, a dependency that started landing in lib/, a duplicated analyzer.
  #
  # Its own job rather than a step inside `reproducible-build`, which already packs: a size red and a
  # reproducibility red mean completely different things, and one job cannot report two verdicts. The
  # cost of that choice is one extra nightly runner and one extra pack (~5 min estimated).
  #
  # -p:EnablePackageValidation=false for the same reasons spelled out on the reproducible-build job:
  # validation is a separate gate with an external nuget.org input, and one job cannot report two
  # verdicts. (It was ALSO broken when this job was written; I15 fixed that in round 23, so the flag no
  # longer masks anything.)
  package-size:
    runs-on: ubuntu-latest
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ESTIMATE, not a measurement — never run on a hosted runner. Local Windows 12-core at 81c4ace: locked
    # restore + pack of both packages = ~20 s with a warm NuGet cache. A ~4-core hosted runner with a cold
    # cache is dominated by restore (~2 min) and the analyzer-heavy Release build (~2 min), ~5 min with SDK
    # setup. Trebled -> 15. Replace this paragraph with the first real run's wall-clock.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      - name: Pack the shipped packages
        run: |
          set -euo pipefail
          for proj in src/DwarfMapper/DwarfMapper.csproj src/DwarfMapper.Testing/DwarfMapper.Testing.csproj; do
            dotnet pack "$proj" -c Release -o "$RUNNER_TEMP/pack" -p:EnablePackageValidation=false
          done
      - name: Check the package-size ceilings
        shell: pwsh
        run: |
          . ./scripts/gate-checks.ps1
          Assert-PackageSizeWithinCeiling -PackageDir "$env:RUNNER_TEMP/pack"
      # Kept on failure only: a ceiling red is a claim about a specific package's bytes, and diagnosing it
      # means opening that package and finding what started shipping.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-size-packages
          path: ${{ runner.temp }}/pack

  # ── Cross-platform nightly legs: windows-latest and macos-latest (round-23 S5) ────────────────────────
  # Every ordinary leg of this workflow runs on ubuntu, and the only cross-OS coverage the repo has is
  # aot-trim-gate's linux-x64/win-x64 publish matrix — which proves the AOT sample compiles and runs, not
  # that the SUITE passes. Correctness is de-facto dual-platform (the maintainer develops on Windows, CI
  # runs ubuntu), so this is cheap insurance rather than an expected discovery; macOS in particular buys
  # little for a Roslyn source generator and is here because "little" is not "nothing" and the leg is
  # nightly.
  #
  # NOT per-push, deliberately: runner cost and wall-clock. The plan's budget puts these at ~10 min each.
  #
  # NO `Category!=SurfaceMatrix` filter, unlike build-test and following deep-test's precedent instead:
  # the nightly tier wants the whole population, the matrix is green and blocking now, and splitting it
  # into a second cross-OS job to preserve the isolation argument would double the runner cost for a leg
  # whose whole purpose is breadth.
  #
  # NO coverage gate here either: the floors are measured on one platform and enforced by deep-test. A
  # second, differently-measured coverage number would be a second thing to keep in sync, and R1's
  # "the floor equals the measurement" cannot mean two measurements at once.
  #
  # Locked-mode restore (via RestoreLockedMode on CI=true) is RID-agnostic and is EXPECTED to hold on both
  # runners. If macOS ever reds with NU1004 while ubuntu stays green, that IS the finding — a platform-
  # dependent resolved graph in a repo that commits its graphs — and it belongs in a ledger, not in an
  # exemption.
  cross-platform:
    strategy:
      # fail-fast off: "does it pass on Windows" and "does it pass on macOS" are two independent
      # questions, and cancelling one because the other failed throws away half the answer.
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    # Nightly cron and manual dispatch only — never on push or pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ESTIMATE, not a measurement — neither runner has ever run this. The local basis, measured 2026-08-22
    # on Windows (12 cores) at 81c4ace: whole-solution Release build 13 s warm, suite 56 s for 6,987 tests
    # with Category!=SurfaceMatrix (the matrix adds ~25 s, so ~81 s for the unfiltered run this leg does).
    # A ~4-core hosted runner is ~3x on the build/test parts and pays a cold NuGet restore on top:
    # reckon ~1 min SDK setup + ~2 min restore + ~3 min build + ~4 min test ≈ 10 min, which is also the
    # plan's own budget figure. Doubled -> 20. Replace with the first real per-OS wall-clocks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # The ISSUE-038 drift assertion, per-runner. build-test proves the pin holds on ubuntu and says
      # nothing about the other two images, which is precisely the gap this job exists to close.
      # `shell: bash` is mandatory here: on windows-latest the default shell is pwsh and this is sh.
      - name: Verify the installed SDK matches global.json
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json)
          actual=$(dotnet --version)
          echo "global.json pins: $pinned"
          echo "dotnet resolves:  $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::SDK drift on ${{ matrix.os }} — global.json pins $pinned but the runner" \
                 "resolved $actual. Update global.json AND the dotnet-version in every setup-dotnet step" \
                 "together."
            exit 1
          fi
      - run: dotnet restore DwarfMapper.NET.sln --locked-mode
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      # --blame-hang: the H7-f runner-level backstop, same rationale as in build-test. It matters more
      # here, not less: a hang that only happens on one OS is exactly the kind of finding this leg is for,
      # and without the dump it would present as an anonymous 20-minute timeout.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --blame-hang --blame-hang-timeout 5m

  # ── .NET preview-SDK canary (round-23 S5) ─────────────────────────────────────────────────────────────
  # A source generator's worst consumer-facing failure is "the new SDK refuses to load it". roslyn-forward-
  # compat asks that question one 10.0.x patch ahead; this asks it one MAJOR ahead, on the .NET 11 preview
  # channel (11.0.100-preview.7 was the published preview SDK when this leg was written).
  #
  # NON-BLOCKING ON PURPOSE, FOR NOW — a deliberate clone of roslyn-forward-compat's shape and of the
  # discipline stated in its own comment. FLIP `continue-on-error` TO FALSE once this leg has been seen
  # GREEN on pushed master, citing that run id in the flip commit; that is the Z3 precedent and it is the
  # same obligation. A gate that cannot fail is decoration. Until then, understand what a red here means:
  # it is INFORMATION about a future SDK, not a regression in this commit.
  #
  # It is expected to be red at first, and for a reason worth naming so nobody "fixes" it wrongly:
  # Directory.Build.props sets TreatWarningsAsErrors with AnalysisLevel=latest-all and AnalysisMode=All,
  # so every analyzer rule a new SDK ADDS arrives as a build error. That is a real forward-compat signal
  # (a consumer on the preview SDK compiling our analyzers sees the same thing), but it is a different
  # finding from "the generator will not load", and the diagnosis has to say which one it saw.
  #
  # NIGHTLY, not per-push: the preview channel moves under us continuously, so a per-push leg would turn
  # its own churn into log noise on every PR while never being able to fail anything.
  preview-sdk-canary:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # ESTIMATE, not a measurement. Same local basis as the cross-platform leg (build 13 s, suite ~81 s
    # unfiltered on a 12-core Windows box at 81c4ace) plus a preview-SDK download and a fully cold,
    # UNPINNED restore. The plan budgets ~5 min; reckon ~12 min on a hosted runner and take 20 so the leg
    # cannot die of its own download. Replace with the first real wall-clock.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview   # the point of the leg: the newest preview of the next major
      - name: Drop the SDK pin for this job only, and PROVE a preview SDK is what we got
        run: |
          set -euo pipefail
          rm -f global.json     # the working copy only; the committed pin is untouched
          actual=$(dotnet --version)
          echo "preview SDK resolved: $actual"
          # The vacuity guard, and it is the whole reason this step exists rather than a bare
          # `dotnet --version`: if setup-dotnet ever falls back to an installed 10.0.x, every step below
          # still passes and the leg becomes a slow, green duplicate of build-test that proves nothing
          # about the next major. Same failure genre as Assert-MutantsWereTested.
          major=${actual%%.*}
          if [ "$major" -lt 11 ]; then
            echo "::error::preview canary resolved SDK $actual, major $major < 11 — this is not a" \
                 "next-major SDK, so the leg would be a duplicate of build-test rather than a canary." \
                 "Check whether the 11.0 preview channel still publishes, or bump dotnet-version." >&2
            exit 1
          fi
      # Locked-mode note, inherited from roslyn-forward-compat verbatim in spirit: this leg runs an
      # UNPINNED, newer-MAJOR SDK, whose package-prune data can change the resolved graph. If it reds with
      # NU1004 while build-test stays green, that IS the diagnosis — SDK-driven graph drift, not a
      # lock-file defect — and it is information this leg exists to surface, not noise to exempt.
      - name: Build the whole solution on the preview SDK
        run: dotnet build DwarfMapper.NET.sln -c Release
      # Same exclusion as build-test and roslyn-forward-compat: the question here is whether the generator
      # still LOADS and EMITS under the next major, and the matrix has its own job.
      # --blame-hang: the H7-f backstop, same rationale as in build-test.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --blame-hang --blame-hang-timeout 5m

  # ── Benchmark wall-time regression: ALERT-ONLY, NEVER A GATE (round-23 S2) ────────────────────────────
  # Tracks the smoke run's MEAN TIMES across nightly runs and surfaces a regression. It must never fail a
  # build, and the reason is not squeamishness — it is invariant R4. Wall-clock on a shared runner is a
  # nondeterministic oracle, and this repository's own measurements say so twice over:
  #
  #   * the Dict-vs-Mapperly throughput figure is PLATFORM-DEPENDENT — 2.13x on Windows, ~1.14x on Linux
  #     for the same benchmark (benchmarks/results/2026-08-11-dict-windows-rerun.md). The numbers this leg
  #     collects are LINUX numbers and must NEVER be quoted as the Windows figures, in the README, in a
  #     release note, or anywhere else. The 3.29x ALLOCATION lead is the platform-independent claim.
  #   * the smoke is a ShortRun (1 launch, 3 warmup, 3 measured iterations — SmokeConfig in
  #     benchmarks/DwarfMapper.Benchmarks/Program.cs), chosen because the ONLY numbers the deep tier gates
  #     on are MemoryDiagnoser's allocated bytes, which are deterministic per SDK. Its timing column is
  #     noisy by construction. Round-21 T8 already gates the deterministic half EXACTLY
  #     (allocation-baseline.json, byte-for-byte, both directions).
  #
  # So the deterministic half is exactly pinned and the nondeterministic half is observed. That is the
  # whole design, and no part of it may migrate into a per-PR gate.
  #
  # HOW "ALERT WITHOUT FAILING" IS WIRED, because the obvious spelling does not work. Reading
  # github-action-benchmark v1.22.1's own dist: handleAlert() returns EARLY when both `comment-on-alert`
  # and `fail-on-alert` are false, so with neither set the `alert-threshold` input is dead decoration and
  # nothing compares anything. `comment-on-alert` needs a github-token and `contents: write` — an
  # automated repo write this workflow deliberately does not take. So: `fail-on-alert: true`, which makes
  # the threshold real, with `continue-on-error: true` ON THE STEP, which keeps the JOB and the workflow
  # GREEN while the alert table lands in the log as an ignored step failure plus a job summary. Verified
  # from the same source that the data file is written and the summary emitted BEFORE the alert throws
  # (writeBenchmark() calls writeBenchmarkToExternalJson -> handleSummary -> handleAlert), so a regression
  # does not freeze the baseline: the next night still compares against last night.
  #
  # The cost of that trick, stated rather than hidden: `continue-on-error` also swallows a genuine action
  # error (a parse break, an upstream change). That is why the step BEFORE it is a plain deterministic
  # check of the input file which DOES fail the job — absence and malformation are not nondeterministic
  # measurements, and "the alert leg could not find its subject" must not read as "no regression".
  # conformance-gate.sh fails on absence for exactly this reason.
  #
  # STORAGE: `external-data-json-path` + actions/cache, the action's own documented tokenless mode. NOT
  # `auto-push` to gh-pages — an automated push is the one thing this repository does not do. The cache
  # key rotates per run with a prefix restore-key, because a fixed key is never re-saved by actions/cache
  # and the history would freeze at the first run. GitHub evicts cache entries unused for 7 days, so a
  # week-long gap in the nightly loses the baseline; the action then reports no previous benchmark and
  # alerts nothing, which is visible in the log and is the honest behaviour.
  #
  # THIRD-PARTY ACTION, maintenance status recorded per the pinning rule: benchmark-action/github-action-
  # benchmark, tag v1.22.1 = 52576c92bccf6ac60c8223ec7eb2565637cae9ba, dated 2026-05-06 — the newest tag
  # at the time of writing, ~3.5 months old, actively released. It is the only third-party action in this
  # workflow that is not from actions/ or github/, and it runs with `permissions: contents: read` and no
  # token, so its blast radius is the runner and the cache.
  #
  # It consumes deep-test's EXISTING `bench-smoke-results` artifact rather than re-running the suite: the
  # smoke already costs ~6:40 nightly and running it twice to alert on it would be absurd. `needs:
  # deep-test` (plain, not `always()`) is deliberate — if deep-test failed, the nightly is already red and
  # this leg's input is untrustworthy; making the alert conditional on a successful producer keeps a red
  # here meaning "the artifact contract broke".
  bench-wall-time-alert:
    runs-on: ubuntu-latest
    needs: deep-test
    # Redundant with the needs-skip above (a skipped dependency skips its dependents) and kept for the
    # reader: this is a nightly leg, exactly like the job it consumes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ESTIMATE, not a measurement — never run. An artifact download of a few hundred KB plus a node action
    # is ~1-2 min; 10 leaves room for a slow download without letting the leg idle.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-smoke-results
          path: bench-results
      # Deterministic input check, and it DOES fail the job. Absence is not a measurement: a missing or
      # unparseable report would otherwise sail past the alert step's continue-on-error and leave a green
      # check that proved nothing — "skipped" indistinguishable from "no regression".
      - name: Assert the smoke report is present and parseable
        run: |
          set -euo pipefail
          report=bench-results/MapperBenchmarks-report-full.json
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing from the bench-smoke-results artifact. deep-test uploads" \
                 "BenchmarkDotNet.Artifacts/results/ after the smoke; either the exporter, the file name" \
                 "or the upload path moved. Listing what did arrive:" >&2
            ls -la bench-results >&2 || true
            exit 1
          fi
          python3 - "$report" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              report = json.load(fh)
          benches = report.get("Benchmarks") or []
          # The adapter reads FullName and Statistics.Mean off every entry. A report with none of those is
          # a report the alert step would silently turn into an empty suite.
          usable = [b for b in benches
                    if b.get("FullName") and isinstance((b.get("Statistics") or {}).get("Mean"), (int, float))]
          if not usable:
              print(f"::error::{sys.argv[1]} carries {len(benches)} benchmark(s) and none has both a "
                    f"FullName and a numeric Statistics.Mean - github-action-benchmark's benchmarkdotnet "
                    f"adapter reads exactly those two fields, so the alert would compare an empty suite.")
              sys.exit(1)
          print(f"{len(usable)}/{len(benches)} benchmarks carry FullName + Statistics.Mean.")
          PYEOF
      # Restores the newest previous history file and saves a fresh entry in the post step. The rotating
      # key is load-bearing: actions/cache never overwrites an existing key, so the documented
      # fixed-key recipe would pin the baseline to the first night forever.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench-history
          key: bench-wall-time-${{ github.run_id }}
          restore-keys: |
            bench-wall-time-
      - run: mkdir -p bench-history
      # ALERT ONLY. See the wiring note above for why fail-on-alert is TRUE here and why that does not
      # make this a gate. Under no circumstances remove `continue-on-error` from this step: that single
      # line is what keeps a nondeterministic wall-clock measurement out of the build's verdict (R4).
      - name: Compare against the previous nightly and alert on a regression
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: DwarfMapper smoke (ShortRun, ubuntu — LINUX numbers, see the job comment)
          tool: benchmarkdotnet
          output-file-path: bench-results/MapperBenchmarks-report-full.json
          external-data-json-path: bench-history/benchmark-data.json
          save-data-file: true
          # 150%: a mean 1.5x worse than the previous night. Generous on purpose — a ShortRun mean on a
          # shared 4-core runner moves far more than a tuned run would, and a threshold tight enough to
          # catch a 10% regression here would alert on scheduler noise every other night.
          alert-threshold: '150%'
          fail-on-alert: true
          # No github-token anywhere in this job: both of these need one, and both would write to the
          # repository. The job summary carries the comparison table instead.
          comment-always: false
          comment-on-alert: false
          summary-always: true
      # The history file is the baseline every future night compares against, and the cache can evict it.
      # Keeping a copy per run makes a lost baseline diagnosable instead of merely puzzling.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-wall-time-history
          path: bench-history/benchmark-data.json
