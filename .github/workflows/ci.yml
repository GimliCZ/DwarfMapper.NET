# Actions are pinned to full commit SHAs (CRA/SLSA supply-chain hardening); the trailing `# vN` is the
# human-readable version. When bumping a version, update BOTH the SHA and the comment.
name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'

      # ── SDK pin drift check (ISSUE-038) ─────────────────────────────────────
      # global.json pins an exact SDK with rollForward: disable, but that only constrains what the SDK
      # RESOLVES to — nothing stopped this workflow from installing a different one and nothing said so
      # out loud. Previously CI asked for '10.0.x' (newest patch of the day) while global.json said
      # '10.0.101' with rollForward: latestPatch, so contributor and CI could silently compile on
      # different compilers. This step is the assertion that makes the pin mean something: if the two
      # ever disagree, the build says which two.
      - name: Verify the installed SDK matches global.json
        run: |
          set -euo pipefail
          # sed, not `grep -oP`: PCRE is a GNU-grep build option and fails outright under some locales.
          pinned=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json)
          actual=$(dotnet --version)
          echo "global.json pins: $pinned"
          echo "dotnet resolves:  $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::SDK drift — global.json pins $pinned but the runner resolved $actual." \
                 "Update global.json AND the dotnet-version in every setup-dotnet step together."
            exit 1
          fi

      - run: dotnet restore DwarfMapper.NET.sln
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore
      # Category!=SurfaceMatrix keeps the executed surface cross-product (854 cells, its own job below) out
      # of the default leg. It is excluded for isolation, not for speed — it is the one leg whose red is
      # expected to be a list of findings rather than a regression, so mixing it into the ordinary run would
      # make every build look broken.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix" --collect:"XPlat Code Coverage" --results-directory TestResults

      # ── Coverage gate for DwarfMapper.Generator ─────────────────────────────
      # Thresholds: line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
      # Target-file requirements (EquatableArray / TypeInterfaces / BlittableProof /
      # LocationInfo / FlattenGraphDirective each ≥ 90% line) are enforced here as well.
      # IMPORTANT: pushing ci.yml changes requires the `workflow` OAuth scope.
      - name: Check generator coverage thresholds
        # Thresholds: overall line ≥ 80% / branch ≥ 70% (achieved ≈84.5%/77.4%; gate is −5pp margin).
        # Per-file: EquatableArray/TypeInterfaces/BlittableProof/LocationInfo/FlattenGraphDirective ≥ 90% line.
        # IMPORTANT: pushing ci.yml requires the `workflow` OAuth scope.
        run: |
          set -euo pipefail
          # A solution-wide `dotnet test --collect` emits ONE cobertura per test
          # project (Generator.Tests, IntegrationTests, Testing.Tests, CorpusTests —
          # every test project in the solution). Only one of them contains the
          # <package name="DwarfMapper.Generator"> node — so we scan ALL reports and
          # key the gate off that package directly, rather than the file-level root
          # rate (which is diluted by, or missing, the generator).
          mapfile -t COBERTURA < <(find TestResults -name "coverage.cobertura.xml")
          if [ ${#COBERTURA[@]} -eq 0 ]; then echo "No coverage.cobertura.xml found"; exit 1; fi
          python3 - "${COBERTURA[@]}" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          GENERATOR_PACKAGE   = "DwarfMapper.Generator"
          LINE_THRESHOLD      = 0.80
          BRANCH_THRESHOLD    = 0.70
          FILE_LINE_THRESHOLD = 0.90

          target_files = {
              "EquatableArray.cs", "TypeInterfaces.cs", "BlittableProof.cs",
              "LocationInfo.cs", "FlattenGraphDirective.cs",
          }

          # Locate the generator package across every report. If split across multiple
          # reports, keep the best line-rate per file and the best package-level rates.
          gen_line = gen_branch = -1.0
          file_rates = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for pkg in root.iter("package"):
                  if pkg.attrib.get("name") != GENERATOR_PACKAGE:
                      continue
                  gen_line   = max(gen_line,   float(pkg.attrib.get("line-rate",   "0")))
                  gen_branch = max(gen_branch, float(pkg.attrib.get("branch-rate", "0")))
                  for cls in pkg.iter("class"):
                      filename = cls.attrib.get("filename", "").replace("\\", "/").split("/")[-1]
                      if filename in target_files:
                          rate = float(cls.attrib.get("line-rate", "0"))
                          file_rates[filename] = max(file_rates.get(filename, 0.0), rate)

          failures = []
          if gen_line < 0:
              failures.append(f"No '{GENERATOR_PACKAGE}' package found in any coverage report")
          else:
              if gen_line < LINE_THRESHOLD:
                  failures.append(f"Generator line coverage {gen_line*100:.1f}% < {LINE_THRESHOLD*100:.0f}%")
              if gen_branch < BRANCH_THRESHOLD:
                  failures.append(f"Generator branch coverage {gen_branch*100:.1f}% < {BRANCH_THRESHOLD*100:.0f}%")
              for fname in target_files:
                  rate = file_rates.get(fname, 0.0)
                  if rate < FILE_LINE_THRESHOLD:
                      failures.append(f"{fname} line coverage {rate*100:.1f}% < {FILE_LINE_THRESHOLD*100:.0f}%")

          if failures:
              print("COVERAGE GATE FAILED:")
              for msg in failures:
                  print(f"  - {msg}")
              sys.exit(1)

          print(f"Coverage gate PASSED  generator line={gen_line*100:.1f}% branch={gen_branch*100:.1f}%")
          for fname, rate in sorted(file_rates.items()):
              print(f"  {fname}: {rate*100:.1f}%")
          PYEOF

  # ── The executed surface cross-product ────────────────────────────────────
  # Every [DwarfSurface] element, at every legal declaration site, in every case its declaration admits, at
  # every endpoint — 854 cells, each verified in BOTH directions against the element's own AppliesTo claim.
  # Its own leg because its red means something different from every other leg's: a failing cell is a
  # measured statement that a caller wrote something the generator accepted, changed nothing for, and said
  # nothing about. The default leg excludes it with Category!=SurfaceMatrix.
  #
  # BLOCKING. It was non-blocking while the first full run was red by design; the 174 red cells are now
  # either a recorded finding in DeclaredDivergences.Reasons (23 findings, 162 cells, each re-measured every
  # run and each failing the build the moment it starts working) or one of twelve cells where a single option
  # of an option bag has no surface at that endpoint. A leg that cannot fail is decoration, and the value of
  # this one is entirely in the failure: a red cell here means a caller wrote something the generator
  # accepted, changed nothing for, and said nothing about. Runtime ~25s: the baseline compile is memoized per
  # (endpoint, fixture, options), so the cross-product costs one compile per cell rather than two.
  surface-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: dotnet test tests/DwarfMapper.Generator.Tests/DwarfMapper.Generator.Tests.csproj -c Release --filter "Category=SurfaceMatrix"

  aot-trim-gate:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runs-on: ubuntu-latest
          - rid: win-x64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      # Fails the build on any IL2xxx (trim) or IL3xxx (AOT) warning.
      #
      # PublishAot is deliberately NOT passed on the command line. The sample's csproj already sets
      # <PublishAot>true</PublishAot>, and `-p:` sets a GLOBAL property, which MSBuild flows down the entire
      # project graph — including src/DwarfMapper.Generator and src/DwarfMapper.CodeFixes, which target
      # netstandard2.0 and can never be AOT-compiled. That produced NETSDK1207 and the job died before
      # compiling anything: a gate failing to START, not a gate catching a regression. It was red from
      # 2026-07-25 until 2026-07-26 for exactly this reason, while the README went on advertising
      # "AOT / trim-safe (CI-verified)". A project-level property applies to that project alone.
      - run: dotnet publish samples/DwarfMapper.AotSample/DwarfMapper.AotSample.csproj -c Release -r ${{ matrix.rid }} -warnaserror -o aot-out
      # Now that the flag is gone, nothing on the command line asserts AOT-ness — and a framework-dependent
      # publish still produces a runnable binary that would sail through the behavioural gate below, leaving
      # it green while proving nothing. NativeAOT emits a native image with NO managed assembly and NO
      # runtimeconfig.json, so assert their ABSENCE before trusting the run.
      - name: Assert the publish really was NativeAOT
        shell: bash
        run: |
          set -euo pipefail
          if ls aot-out/*.runtimeconfig.json >/dev/null 2>&1 \
            || ls aot-out/DwarfMapper.AotSample.dll >/dev/null 2>&1; then
            echo "FAIL: aot-out holds a managed assembly or runtimeconfig.json, so this was NOT a NativeAOT" >&2
            echo "      publish. The behavioural gate below would then pass without proving anything." >&2
            ls -la aot-out >&2
            exit 1
          fi
          echo "NativeAOT confirmed: no managed assembly, no runtimeconfig.json in aot-out."
      # Publishing proves it COMPILES trim/AOT-clean; it says nothing about behaviour. The sample is written
      # as a behavioural gate (36 `return 1` sites) and was never executed, so CORRECTNESS.md's "runs a
      # behavioural gate over the published native binary" was untrue until this step existed.
      - name: Execute the published AOT binary (behavioural gate)
        shell: bash
        run: |
          set -euo pipefail
          BIN="aot-out/DwarfMapper.AotSample"
          [[ "${{ matrix.rid }}" == win-* ]] && BIN="aot-out/DwarfMapper.AotSample.exe"
          if [[ ! -x "$BIN" && ! -f "$BIN" ]]; then
            echo "FAIL: published AOT binary not found at $BIN — a gate that cannot find its subject must not pass." >&2
            exit 1
          fi
          "./$BIN"

  # ── Conformance gate (fail-closed) ────────────────────────────────────────
  # samples/DwarfMapper.Conformance returns a real exit code from its assertions and was never executed by
  # CI, so it only ran when someone remembered. The script also fails on ABSENCE — missing artifact, wrong
  # commit, or a shrunken assertion count — because a gate that only fails when the run fails still passes
  # when the run never happened, and "skipped" is indistinguishable from "passed" in a green check.
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: chmod +x scripts/conformance-gate.sh
      - run: ./scripts/conformance-gate.sh linux-x64
      - name: Publish the dated conformance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-results
          path: conformance/results/

  # ── Forward-compatibility leg: does the generator still load in a NEWER compiler? ────────────────────
  # The floor (Microsoft.CodeAnalysis 5.0.0) is what every other job builds, and it is what the pinned SDK
  # 10.0.101 carries. This job answers the other half: a consumer on a newer 10.0.x SDK runs our generator
  # inside THEIR compiler, and a generator built against a newer Roslyn than the host refuses to load with
  # CS9057. Measured locally: referencing 5.6.0 while building on SDK 10.0.101 fails with exactly that,
  # which is why this leg needs its own, newer SDK and cannot live in build-test.
  #
  # NON-BLOCKING ON PURPOSE, FOR NOW. It was authored without a machine that has a newer 10.0.x SDK, so its
  # first real run happens here. Flip `continue-on-error` to false once it has been seen green — a gate that
  # cannot fail is decoration, and leaving it like this permanently would be exactly the kind of thing the
  # rest of this pipeline exists to prevent.
  roslyn-forward-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'   # deliberately NOT the pin: this leg is about a newer host
      - name: Drop the SDK pin for this job only
        run: |
          set -euo pipefail
          rm -f global.json     # the working copy only; the committed pin is untouched
          dotnet --version
      - name: Build the generator against the floor, on a newer compiler
        run: dotnet build DwarfMapper.NET.sln -c Release
      # Same exclusion as build-test: this leg asks "does the generator still LOAD in a newer compiler", and
      # the surface matrix's expected red would drown that answer.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=SurfaceMatrix"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: csharp
      - run: dotnet build DwarfMapper.NET.sln -c Release
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  sbom:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - run: dotnet tool install --global CycloneDX --version 6.2.0
      - run: dotnet CycloneDX DwarfMapper.NET.sln -o ./sbom
      # SLSA build-provenance attestation for the generated SBOM artifact.
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ./sbom
