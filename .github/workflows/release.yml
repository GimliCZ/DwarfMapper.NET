# SPDX-License-Identifier: GPL-2.0-only
# Release pipeline. On a version tag (e.g. v1.0.0-rc.1) this builds, tests, packs,
# SBOMs, checksums, and signs the NuGet packages KEYLESSLY via GitHub's OIDC
# identity (Sigstore build-provenance attestation), then publishes them all to a
# GitHub Release. Pushing to nuget.org is the separate `publish` job below: NuGet Trusted
# Publishing (a short-lived key minted from this workflow's OIDC token, no stored API key),
# approved by a human in the `release` environment, and OFF until the owner opts in.
#
# Signing model: no private key is stored anywhere. Authenticity is proven by the
# combination of each artifact's SHA-256 fingerprint and a provenance attestation
# bound to this repository's GitHub identity — verify with `gh attestation verify`.
# See docs/RELEASING.md.
#
# Actions are pinned to full commit SHAs (CRA/SLSA supply-chain hardening); the
# trailing `# vN` is the human-readable version. Bump BOTH when updating.
name: release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write       # OIDC for keyless Sigstore signing (ties to this repo's identity)
      attestations: write   # write the build-provenance attestation
    steps:
      # Round 31 T20: first step of every job. AUDIT mode records each job's network egress and changes no
      # behaviour; the recorded baseline is what a later round tightens to an allow-list (block mode).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore DwarfMapper.NET.sln
      - run: dotnet build DwarfMapper.NET.sln -c Release --no-restore -p:Version=$VERSION -p:ContinuousIntegrationBuild=true
      # ilverify (round 32 T03): the test step below reaches EmittedIlIsVerifiableTests, which fails loudly
      # when the tool is absent, so a tag would have failed its own test step. Same pinned version as ci.yml;
      # CiToolPrerequisiteScanTests holds every workflow to it.
      - run: dotnet tool install --global dotnet-ilverify --version 10.0.11
      # Category!=Perf: wall-clock ratio tests run in CI's nightly perf-tests job, never on a release runner.
      - run: dotnet test DwarfMapper.NET.sln -c Release --no-build --filter "Category!=Perf"
      - run: dotnet pack DwarfMapper.NET.sln -c Release --no-build -o artifacts -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      # ── SBOM (CycloneDX, machine-readable — CRA Annex I) ─────────────────────
      - run: dotnet tool install --global CycloneDX --version 6.2.0
      - run: dotnet CycloneDX DwarfMapper.NET.sln -o artifacts/sbom

      # ── SHA-256 control hashes (the artifact "fingerprints") ─────────────────
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.nupkg *.snupkg > SHA256SUMS
          echo "── SHA256SUMS ──"; cat SHA256SUMS

      # ── Keyless signature: SLSA build-provenance bound to the GitHub identity ─
      #    No stored key. Verify later with:
      #      gh attestation verify <pkg> --repo GimliCZ/DwarfMapper.NET
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # ── Publish a GitHub Release with all artifacts ──────────────────────────
      #    nuget.org publishing is done MANUALLY by the maintainer (deliberate control
      #    over what goes public) — download the signed .nupkg/.snupkg from the Release
      #    and `dotnet nuget push` them. See docs/RELEASING.md.
      # Release notes come from CHANGELOG.md so the human-readable "what changed" is written and reviewed in
      # the same commit as the change, not typed into a release form afterwards. A tag whose version has no
      # section fails here rather than shipping notes that say nothing — a release with no changelog entry is
      # a release nobody can audit.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # index(), not a regex: a version like 1.0.2-rc.1 is full of regex metacharacters, and `.`
          # matching any character would let 1I0I2 select the 1.0.2 section.
          notes=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section (or it is empty)." \
                 "Add one before tagging — see the comment at the end of CHANGELOG.md."
            exit 1
          fi
          {
            echo "NOTES<<CHANGELOG_EOF"
            printf '%s\n\n' "$notes"
            echo "---"
            echo "Keyless-signed via GitHub OIDC (Sigstore build-provenance — verify with"
            echo "\`gh attestation verify <pkg> --repo GimliCZ/DwarfMapper.NET\`), with a CycloneDX SBOM and"
            echo "SHA256SUMS attached. Published to nuget.org manually by the maintainer."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      # Handed to the publish job: the SAME signed packages the Release carries, not a rebuild.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS artifacts/sbom/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"

  # ── nuget.org publishing via Trusted Publishing (round 31 T21, research A4) ──────────────────────────────
  # No API key is stored anywhere: NuGet/login exchanges this job's GitHub OIDC token for a ~1-hour,
  # single-use nuget.org key, bound by the nuget.org Trusted Publishing policy to THIS repository, THIS
  # workflow file and THIS environment. The deliberate manual gate is kept: the `release` environment has
  # required reviewers, so the push waits for a human approval on every tag.
  #
  # OFF UNTIL THE OWNER OPTS IN, and that is a safety property, not a formality: GitHub auto-creates an
  # environment that a job names but that does not exist yet — WITHOUT protection rules. Gating on a
  # repository variable means nothing is attempted until the owner has created the nuget.org policy, the
  # `release` environment with required reviewers, and the NUGET_USER secret, and then sets
  # NUGET_TRUSTED_PUBLISHING=true. Until then a tag releases exactly as before (GitHub Release, manual push).
  publish:
    needs: release
    if: vars.NUGET_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC token NuGet/login exchanges for a short-lived nuget.org key
    timeout-minutes: 15
    steps:
      # Round 31 T20: first step of every job. AUDIT mode records each job's network egress and changes no
      # behaviour; the recorded baseline is what a later round tightens to an allow-list (block mode).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.101'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # the nuget.org PROFILE name, not an e-mail address
      # The key reaches the command through env, not through ${{ }} inside the script (zizmor
      # template-injection); .snupkg files beside each .nupkg are pushed with it by `dotnet nuget push`.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
