# The enrolment entry for Anthropic's OSS Scanner (https://github.com/anthropics/oss-scanner): the exact text of
# projects/dwarfmapper/project.yaml in that repository, kept here so it is reviewed and tested with the files it names.
# The scanner reads THEIR copy, never this one, and enrolment is a pull request there - until it merges, this file
# claims nothing. OssScannerImageTests holds it to SECURITY.md (one contact, everywhere a reporter is told where to
# go), to the repository URL the packages declare, and to the Dockerfile and threat model it points at.

# The ONE repository to scan; pinned to master, where the Dockerfile and threat model below must already be.
repo: https://github.com/GimliCZ/DwarfMapper.NET#master

# PUBLIC: published in the scanner's repository. Reports, build failures and the scanner team's questions go here.
primary_contact: dwarfmapper@seznam.cz

homepage: https://github.com/GimliCZ/DwarfMapper.NET

disabled: false

dockerfile: .oss-scanner/Dockerfile

threat_model: .oss-scanner/threat_model.md
