# SPDX-License-Identifier: GPL-2.0-only
#
# Codecov configuration — the hosted replacement for the inline coverage gate in .github/workflows/ci.yml.
#
# WHY THIS EXISTS, and what changes. The inline gate checks ONE assembly (DwarfMapper.Generator) at 80 % line
# and 70 % branch. The floors actually enforced locally by scripts/housekeeping.ps1 are 94.5 % for that same
# assembly and cover FIVE. So CI has been gating fourteen points below the measured reality and blind to four
# assemblies entirely — the swap tightens the gate rather than relaxing it, which is the opposite of what
# "move the gate to a third party" usually means and is the reason it is worth doing.
#
# EVERY TARGET BELOW IS A MEASURED VALUE, copied from the floors in scripts/housekeeping.ps1, which are
# themselves measurements truncated to one decimal and never aspirations. When a floor moves there it moves
# here in the same commit; they are two statements of one fact and there is no mechanism that reconciles them
# if they drift, so keep them together by hand until there is.
#
# COMPONENTS, NOT FLAGS, on purpose. Flags require every upload to declare which assembly it belongs to, and
# this repository emits one cobertura per test project across two tiers (fast and nightly-deep) — plumbing
# that correctly is a second thing to get wrong. Components partition by PATH on Codecov's side from exactly
# the same uploads, so the mapping lives in one file instead of being distributed across CI steps.
#
# WHAT THIS CANNOT DO. Mutation scores are not coverage and do not belong here. The Stryker Dashboard hosts
# mutation reports but publishes no status check, so mutation stays gated by each leg's `break` threshold
# inside the run itself — see Issues/round27/PLAN-hosted-reports.md.

codecov:
  require_ci_to_pass: true
  notify:
    # Wait for every upload before judging. The fast tier and the nightly deep tier both produce cobertura,
    # and the deep tier covers strictly more (tests/Shared/DeepTier.cs multiplies the population), so a
    # verdict reached on the fast tier alone would understate coverage and red the build for a reason that
    # is an artefact of upload ordering.
    wait_for_ci: true

coverage:
  precision: 1
  round: down          # matches the floors' [math]::Floor(x*10)/10 convention exactly
  range: "85...100"

  status:
    project:
      default:
        # The whole-repo number is informational: it moves whenever the ratio of assembly sizes changes,
        # which is not a quality signal. The per-component statuses below are the real gate.
        informational: true

    patch:
      default:
        # New and changed lines must be covered. This is the check the per-assembly floors CANNOT make:
        # a floor is satisfied by a large well-covered assembly absorbing a small uncovered addition, and
        # that is precisely how coverage erodes without any floor ever going red.
        target: 90%
        threshold: 0%

component_management:
  individual_components:
    - component_id: generator
      name: DwarfMapper.Generator
      paths:
        - src/DwarfMapper.Generator/**
      statuses:
        - type: project
          target: 94.5%
          threshold: 0%

    - component_id: runtime
      name: DwarfMapper
      paths:
        - src/DwarfMapper/**
      statuses:
        - type: project
          target: 91.2%
          threshold: 0%

    - component_id: doctooling
      name: DwarfMapper.DocTooling
      paths:
        - src/DwarfMapper.DocTooling/**
      statuses:
        - type: project
          target: 96.0%
          threshold: 0%

    - component_id: codefixes
      name: DwarfMapper.CodeFixes
      paths:
        - src/DwarfMapper.CodeFixes/**
      statuses:
        - type: project
          target: 96.2%
          threshold: 0%

    - component_id: testing
      name: DwarfMapper.Testing
      paths:
        - src/DwarfMapper.Testing/**
      statuses:
        - type: project
          target: 87.1%
          threshold: 0%

ignore:
  # Not shipping code. Samples are written for readability, benchmarks for measurement, and the conformance
  # sample deliberately exercises shapes no consumer should copy; counting them would move the number for
  # reasons unrelated to the product.
  - "samples/**"
  - "benchmarks/**"
  - "tests/**"
  - "**/obj/**"
  - "**/bin/**"

comment:
  layout: "condensed_header, diff, components, condensed_files"
  require_changes: true      # no comment when coverage is unchanged; PR noise is how annotations get ignored
